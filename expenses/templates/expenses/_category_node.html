{% load static %}
<li class="stagger-item" style="--i: {{ index|default:0 }}" x-transition:leave="transition ease-in duration-200" x-transition:leave-end="opacity-0 -translate-x-2">
  <div class="group/row flex items-center justify-between gap-3 rounded-xl px-3 py-2 transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/40">
    <span class="flex items-center gap-2.5 text-sm text-slate-700 dark:text-slate-200">
      <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-gradient-brand"></span>
      {{ node.category.name }}
    </span>
    <form id="delete-form-{{ node.category.id }}" method="post" action="{% url 'expenses:delete_category' node.category.id %}" class="contents">
      {% csrf_token %}
      <button type="button"
              @click="confirmId = {{ node.category.id }}; confirmName = '{{ node.category.name|escapejs }}'"
              title="Delete category"
              class="btn-press grid h-8 w-8 shrink-0 place-items-center rounded-lg text-slate-400 opacity-0 transition group-hover/row:opacity-100 hover:bg-rose-50 hover:text-rose-600 focus:opacity-100 dark:hover:bg-rose-500/10 dark:hover:text-rose-400">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
      </button>
    </form>
  </div>
  {% if node.children %}
    <ul class="ml-5 space-y-1 border-l border-slate-200 pl-3 dark:border-slate-800">
      {% for child in node.children %}
        {% include "expenses/_category_node.html" with node=child index=forloop.counter0 %}
      {% endfor %}
    </ul>
  {% endif %}
</li>
