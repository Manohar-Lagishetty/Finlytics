<div style="font-family: 'Segoe UI', Helvetica, Arial, sans-serif; background:#f8fafc; padding:32px;">
  <div style="max-width:420px; margin:0 auto; background:#ffffff; border-radius:20px; padding:36px 32px; border:1px solid #e2e8f0;">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:24px;">
      <div style="width:36px; height:36px; border-radius:10px; background:linear-gradient(135deg,#6366f1,#4338ca); color:#fff; font-weight:800; text-align:center; line-height:36px;">F</div>
      <span style="font-weight:800; font-size:18px; color:#0f172a;">Finlytics</span>
    </div>
    <p style="color:#334155; font-size:15px; margin:0 0 6px;">Hi {{ user.display_name }},</p>
    <p style="color:#334155; font-size:15px; line-height:1.6; margin:0 0 24px;">
      Use the code below to verify your email and finish creating your Finlytics account.
      This code expires in 10 minutes.
    </p>
    <div style="text-align:center; margin:28px 0;">
      <span style="display:inline-block; letter-spacing:10px; font-size:32px; font-weight:800; color:#4338ca; background:#eef2ff; padding:16px 20px; border-radius:14px;">
        {{ code }}
      </span>
    </div>
    <p style="color:#94a3b8; font-size:13px; line-height:1.6; margin:0;">
      If you didn't request this, you can safely ignore this email.
    </p>
  </div>
</div>
